<style>
/* Layout: full-viewport pan/zoom canvas (Miro-like) holding an org tree; top bar with search + jump chips; zoom dock bottom-right; details in a side drawer. Style mirrors the YBC onboarding site. */
:root{
  --bg:#f2f1f7; --dots:#d3d2dc; --surface:#ffffff; --surface-2:#e9e8f0; --ink:#0f1214; --ink-muted:#5b5e60;
  --border:#dedde6; --line:#9a98a8; --accent:#fa5255; --accent-strong:#d93438; --accent-soft:#fde2e2;
  --node-dark:#0f1214; --node-dark-ink:#ffffff; --shadow:0 1px 2px rgba(15,18,20,.08),0 6px 18px rgba(15,18,20,.08);
  --logo-filter:none; --scrim:rgba(15,18,20,.4);
  --display:"Oswald",Impact,"Arial Narrow",sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121317; --dots:#2a2c35; --surface:#1c1e25; --surface-2:#2a2d38; --ink:#f2f1f7; --ink-muted:#a4a7b0;
  --border:#33363f; --line:#6c6f7c; --accent:#fa5255; --accent-strong:#ff7578; --accent-soft:#3a1f22;
  --node-dark:#f2f1f7; --node-dark-ink:#0f1214; --shadow:none; --logo-filter:invert(1); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121317; --dots:#2a2c35; --surface:#1c1e25; --surface-2:#2a2d38; --ink:#f2f1f7; --ink-muted:#a4a7b0;
  --border:#33363f; --line:#6c6f7c; --accent:#fa5255; --accent-strong:#ff7578; --accent-soft:#3a1f22;
  --node-dark:#f2f1f7; --node-dark-ink:#0f1214; --shadow:none; --logo-filter:invert(1); --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.4;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
body{-webkit-user-select:none;user-select:none}
input,.drawer,.results{-webkit-user-select:text;user-select:text}
.drawer button,.results button{-webkit-user-select:none;user-select:none}
h2,h4{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;font-weight:700;margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{flex:none;display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap;position:relative;z-index:20}
.logo{height:32px;width:auto;filter:var(--logo-filter)}
.ttl{font:600 1rem var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);border-left:1px solid var(--border);padding-left:14px}
.search{margin-left:auto;flex:1 1 240px;max-width:380px;position:relative}
.search input{width:100%;min-height:42px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);border-radius:12px;padding:0 14px;font:600 .9rem var(--body)}
.search input::placeholder{color:var(--ink-muted);font-weight:500}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;padding:6px;z-index:30}
.res{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px}
.res:hover{background:var(--surface-2)}.res span{color:var(--ink-muted);font-size:.8rem}
.chips{flex:none;display:flex;gap:8px;padding:8px 16px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--border);z-index:19;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;font:700 .78rem var(--body);min-height:36px}
#cmenu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:200px;max-height:70vh;overflow:auto}
#cmenu button{border:0;background:none;text-align:left;border-radius:8px;padding:0 12px;min-height:38px;font:600 .9rem var(--body)}

#cmenu .all{border-bottom:1px solid var(--border);border-radius:8px 8px 0 0;color:var(--accent-strong);font-weight:700;margin-bottom:4px}
.chip.on{border-color:var(--accent);color:var(--accent-strong)}
.poslink{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;text-decoration:none;cursor:pointer}
.person .poslink{color:var(--ink-muted)}
.poslink:hover{color:var(--accent-strong)}
.meta .poslink{color:var(--ink);font-weight:600}
.back{display:inline-block;margin:0 0 10px;min-height:36px;border:1px solid var(--border);background:var(--surface);border-radius:100px;padding:0 12px;font:600 .82rem var(--body)}
.back:hover{border-color:var(--accent)}
.tag-s{font-style:normal;font-weight:500;color:var(--ink-muted);font-size:.74rem;text-transform:none;letter-spacing:0;font-family:var(--body)}

.chip:hover{border-color:var(--accent);color:var(--accent-strong)}
#vp{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab}

#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}

.node{position:absolute;border-radius:16px;padding:9px 12px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer;user-select:none;-webkit-user-select:none;border:0;background:var(--surface);box-shadow:none}
.node:hover{box-shadow:0 0 0 2px var(--accent)}
.node b{font-weight:800;font-size:.92rem;line-height:1.2}

.node.root{background:var(--surface);color:var(--ink);text-align:center}
.node.root b{font:700 1.1rem/1.2 var(--display);text-transform:uppercase;letter-spacing:.03em}
.node.root span{color:var(--ink-muted)}
.node.hub{background:var(--accent);border-color:transparent;color:#fff;text-align:center}
.node.hub b{font:700 1.35rem/1.15 var(--display);text-transform:uppercase;letter-spacing:.04em}
.node.hub span{color:#fff;opacity:.9}
.node.fn{background:var(--surface);color:var(--ink);text-align:center}
.node.fn b{font:700 1.05rem/1.2 var(--display);text-transform:uppercase;letter-spacing:.04em}
.node.fn span{color:var(--ink-muted)}
.node.person{background:var(--surface)}
.node.person b{font-weight:700;font-size:.86rem}
.node.vac span{font-style:italic}
.node .tg{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;padding:0;background:var(--accent);color:#fff;font:700 1.1rem/28px var(--body);text-align:center;cursor:pointer}
.node .tg:hover{background:var(--accent-strong);box-shadow:0 0 0 4px var(--accent-soft)}
.node.fn{padding-right:38px}
.node.hit{outline:3px solid var(--accent);outline-offset:3px}
.dock{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);z-index:10}
.dock button{width:40px;height:40px;border-radius:10px;border:0;background:transparent;font:700 1.2rem var(--body);display:grid;place-items:center}
.dock button:hover{background:var(--surface-2)}
.dock .pct{width:auto;min-width:84px;padding:0 10px;font-size:.88rem;font-variant-numeric:tabular-nums;display:flex;justify-content:center;gap:6px;border-left:1px solid var(--border);border-right:1px solid var(--border);border-radius:0}
.zmenu{position:relative}
.zlist{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 10px);list-style:none;margin:0;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:120px}
.zlist button{width:100%;height:36px;border:0;box-shadow:none;background:none;border-radius:8px;font:600 .88rem var(--body);text-align:left;padding:0 12px;display:block}
.zlist button:hover,.zlist button.on{background:var(--accent-soft);color:var(--accent-strong)}
.hint{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:.78rem;color:var(--ink-muted);max-width:min(340px,calc(100% - 96px));box-shadow:var(--shadow)}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:50;overflow:auto;padding:22px 20px calc(28px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--border);box-shadow:var(--shadow)}
.close{position:sticky;top:0;float:right;min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:1.2rem}
.drawer h2{font-size:1.7rem;margin:6px 0 4px;padding-right:50px}
.fnlab{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-strong);font-weight:700}
.mission{background:var(--accent-soft);border-radius:16px;padding:12px 14px;margin:14px 0;font-size:.93rem}
.mission b{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem;margin:0 0 6px}
.meta dt{color:var(--ink-muted);font-weight:600}.meta dd{margin:0;font-weight:600}
.drawer h4{font-size:.95rem;margin:20px 0 8px;letter-spacing:.06em}
.drawer ol,.drawer ul{margin:0;padding-left:1.3em;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.drawer li::marker{color:var(--accent-strong);font-weight:700}
.kg{list-style:none;margin-left:-1.3em;font:600 .78rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted)}
.person{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.9rem;flex-wrap:wrap}
.person span{color:var(--ink-muted)}.person .h{font-weight:600;font-size:.82rem;overflow-wrap:anywhere}
.kg2{font:700 .72rem var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-muted);margin:14px 0 6px}
.person{flex-direction:column;align-items:flex-start;gap:6px;padding:10px 0}
.person .h{flex:none;max-width:100%}
.tg-wrap{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px;max-width:100%}
.tg-l{font:600 .64rem var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-muted);padding-left:3px;opacity:.85}
.tg-chip{display:inline-flex;align-items:center;gap:2px;max-width:100%;padding:3px 3px 3px 10px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface-2)}
.tg-t{font:600 .82rem var(--body);overflow-wrap:anywhere}
.copy{flex:none;width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:var(--ink-muted);display:grid;place-items:center}
.copy:hover{background:var(--surface);color:var(--ink)}
.copy.done{color:var(--accent-strong)}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btnrow .btn{margin-top:0}
.btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.solid:hover{background:var(--accent-strong)}
.pc-h{margin-top:4px}.rrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:10px 12px;margin-bottom:6px;min-height:44px}
.rrow:hover{border-color:var(--accent)}.rrow span{color:var(--ink-muted);font-size:.82rem;white-space:nowrap}
.person .where{flex-basis:100%;font-size:.78rem}
.vacl{color:var(--ink-muted);font-size:.88rem;font-style:italic}
.btn{margin-top:14px;min-height:44px;border:1.5px solid var(--accent);background:transparent;color:var(--accent-strong);border-radius:100px;padding:0 20px;font-weight:700}
.node .tg::after{content:"";position:absolute;inset:-16px -10px -16px -14px}
.hint{transition:opacity .4s}.hint.gone{opacity:0;pointer-events:none}
.chips{scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
@media (max-width:600px){
  .ttl{display:none}.drawer{border-left:0}
  .bar{flex-wrap:nowrap;gap:10px;padding:8px 12px}
  .logo{height:28px;flex:none}
  .search{flex:1 1 0;min-width:0;max-width:none;margin-left:0}
  .search input{min-height:44px;font-size:16px}
  .chips{padding:8px 12px;gap:8px}
  .chip{min-height:40px;padding:8px 14px;font-size:.84rem}
  .chip-link{margin-left:0}
  .node .tg{width:34px;height:34px;font-size:1.3rem;line-height:34px}
  .hint{left:12px;right:12px;top:12px;bottom:auto;max-width:none;text-align:center;font-size:.82rem;padding:10px 12px}
  .dock{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .dock button{width:46px;height:46px}.dock .pct{min-width:80px}
  .zlist button{height:44px}
  #cmenu button{min-height:44px}
  .scrim{background:var(--scrim)}
  .drawer{top:auto;left:0;right:0;bottom:0;width:100%;height:auto;max-height:88vh;max-height:88dvh;border-radius:24px 24px 0 0;border-top:1px solid var(--border);padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(15,18,20,.25)}
  .drawer::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 12px}
  .drawer h2{font-size:1.45rem}
  .copy{width:40px;height:40px}
  .tg-chip{padding:3px 3px 3px 12px}
  .rrow{min-height:48px}
  .person{padding:12px 0}
}
@media (prefers-reduced-motion:reduce){#stage.anim{transition:none}}

function openDrawer(html){var bk=stack.length>1;$("#drawer").innerHTML='<button class="close" id="cl" aria-label="Закрити">✕</button>'+(bk?'<button type="button" class="back" id="bk">← Назад</button>':'')+html;$("#layer").hidden=false;$("#cl").onclick=closeDrawer;if(bk)$("#bk").onclick=function(){stack.pop();stack[stack.length-1]()};$("#drawer").scrollTop=0;$("#cl").focus()}
function closeDrawer(){$("#layer").hidden=true;stack=[]}
$("#scrim").onclick=closeDrawer;
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeDrawer();$("#res").hidden=true}});
var COPY_SVG='<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6"/><path d="M10.5 3.5v-.4a1.6 1.6 0 0 0-1.6-1.6H3.1a1.6 1.6 0 0 0-1.6 1.6v5.8a1.6 1.6 0 0 0 1.6 1.6h.4"/></svg>';
var OK_SVG='<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
function handleHtml(h){if(!h)return"";return'<span class="tg-wrap"><span class="tg-l">Telegram</span><span class="tg-chip"><span class="tg-t">'+esc(h)+'</span><button class="copy" type="button" data-copy="'+esc(h)+'" aria-label="Копіювати нік '+esc(h)+'" title="Копіювати">'+COPY_SVG+'</button></span></span>'}
function copyText(s,done){
  function fb(){var a=document.createElement("textarea");a.value=s;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();done()}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(done,fb)}else fb()}
document.addEventListener("click",function(e){var b=e.target.closest(".copy");if(!b)return;e.stopPropagation();
  copyText(b.dataset.copy,function(){b.innerHTML=OK_SVG;b.classList.add("done");b.title="Скопійовано";setTimeout(function(){b.innerHTML=COPY_SVG;b.classList.remove("done");b.title="Копіювати"},1400)})});function findRole(t){var r=roleFor(t)||ROLES.filter(function(q){return q.t===t||q.t.replace(/ · .*/,"")===t})[0];return r&&(r.d.length||r.k.length)?r:null}
function posHtml(t){return findRole(t)?'<button type="button" class="poslink" data-pos="'+esc(t)+'" title="Відкрити опис посади">'+esc(t)+'</button>':'<span>'+esc(t)+'</span>'}
document.addEventListener("click",function(e){var b=e.target.closest(".poslink");if(!b)return;e.stopPropagation();
  var r=findRole(b.dataset.pos);if(!r)return;
  go(function(){openDrawer(roleHtml(r,true))})});
function personRow(x){return'<div class="person"><div><b>'+esc(x[0])+'</b><br>'+posHtml(x[1])+'</div><div class="h">'+handleHtml(x[2])+'</div></div>'}
function listHtml(a,cls){var h="",open=false;
  a.forEach(function(x){if(x.charAt(0)==="#"){if(open)h+="</"+cls+">";open=false;h+='<div class="kg2">'+esc(x.slice(1))+'</div>'}
    else{if(!open){h+="<"+cls+">";open=true}h+="<li>"+esc(x)+"</li>"}});
  if(open)h+="</"+cls+">";return h}
function roleHtml(r,generic){
  var h='<div class="fnlab">'+(generic?"Опис посади":"Посада")+'</div><h2>'+esc(r.t)+(r.tag?' <small class="tag-s">'+esc(r.tag)+'</small>':'')+'</h2>';
  if(r.m)h+='<div class="mission"><b>Місія</b>'+esc(r.m)+'</div>';
  h+='<dl class="meta"><dt>Керівник</dt><dd>'+esc(r.b)+'</dd><dt>Локація</dt><dd>'+esc(r.l)+'</dd>'+(r.fn?'<dt>Відділ</dt><dd>'+esc(r.fn)+'</dd>':'')+'</dl>';
  if(!generic)h+='<h4>Хто на посаді · '+r.p.length+'</h4>';
  if(!generic)h+=r.p.length?r.p.map(function(s){var a=s.split("|");return'<div class="person"><div><b>'+esc(a[0])+'</b></div><div class="h">'+handleHtml(a[1])+'</div>'+(a[2]?'<span class="where">'+esc(a[2])+'</span>':'')+'</div>'}).join(""):'<div class="vacl">У документі людину не вказано.</div>';
  if(r.d.length)h+='<h4>Обов\'язки</h4>'+listHtml(r.d,"ol");else if(r.nodoc)h+='<div class="vacl">Опису обов\'язків у документі немає.</div>';
  if(r.k.length)h+='<h4>Показники ефективності</h4>'+listHtml(r.k,"ul");return h}
function groupBoss(title,b){
  function who(re,label){var xs=b.p.filter(function(y){return re.test(y[1])});return xs.length?label+" ("+xs.map(function(y){return y[0]}).join(", ")+")":""}
  if(/^(Partner|Акціонер|Співвласник)/.test(title))return"";
  function owners(){return[who(/^Partner/,"Partner"),who(/^Акціонер/,"Акціонер")].filter(Boolean).join(", ")}
  if(/^(CEO|COO)/.test(title))return owners();
  if(title==="Chief of BM")return"Андрій Остапчук (Управляючий партнер)";
  if(/Business Manager|^BM/.test(title)){var c=who(/^Chief of BM/,"Chief of BM");if(c)return c;var h=who(/^Head of BM/,"Head of BM Online");if(h)return h}
  return who(/^CEO/,"CEO")||who(/^COO/,"COO")||owners()||(b.fr?"":"CEO локації")}
function personCard(p){
  var r=p.role||roleFor(p.pos);var boss=p.org?groupBoss(p.pos,p.org):(p.role?p.role.b:"");
  var h='<div class="fnlab">Людина</div><h2>'+esc(p.name)+'</h2><dl class="meta"><dt>Посада</dt><dd>'+(findRole(p.pos)?'<button type="button" class="poslink" data-pos="'+esc(p.pos)+'" title="Відкрити опис посади">'+esc(p.pos)+'</button>':esc(p.pos))+'</dd><dt>Локація</dt><dd>'+esc(p.where)+'</dd>'+(p.dep?'<dt>Відділ</dt><dd>'+esc(p.dep)+'</dd>':'')+(boss?'<dt>Керівник</dt><dd>'+esc(boss)+'</dd>':'')+'</dl>'+(p.handle?'<div class="pc-h">'+handleHtml(p.handle)+'</div>':'<div class="vacl">Telegram не вказано</div>')+
    '<div class="btnrow"><button class="btn solid" id="pc-show">Показати на схемі</button>'+(r&&r!==p.role?'<button class="btn" id="pc-role">Опис посади</button>':(r?'<button class="btn" id="pc-role">Обов\'язки та KPI</button>':''))+'</div>';
  return h}
function openPerson(p){stack=[];go(function(){showPerson(p)})}
function showPerson(p){
  openDrawer(personCard(p));
  $("#pc-show").onclick=function(){var n=p.node;closeDrawer();openUp(n);render();n.el.classList.add("hit");fly(n,false)};
  var rb=$("#pc-role");if(rb){var r=p.role||roleFor(p.pos);rb.onclick=function(){go(function(){openDrawer(roleHtml(r,!p.role))})}}}
function rootDrawer(n){
  if(n.people.length===1)return showPerson({name:n.people[0].name,pos:n.people[0].pos,where:n.people[0].where,handle:n.people[0].handle,node:n});
  openDrawer('<div class="fnlab">Central Services</div><h2>'+esc(n.t)+'</h2><h4>Хто · '+n.people.length+'</h4>'+n.people.map(function(p){return personRow([p.name,p.pos,p.handle])}).join(""))}function fnDrawer(n){var rs=[];(function w(m){if(m.role)rs.push(m);m.ch.forEach(w)})(n);
  var h='<div class="fnlab">Відділ</div><h2>'+esc(n.t)+'</h2><h4>Посади · '+rs.length+'</h4>'+rs.map(function(m,i){return'<button class="rrow" data-i="'+i+'"><b>'+esc(m.t)+'</b><span>'+esc(m.s)+'</span></button>'}).join("");
  openDrawer(h);Array.prototype.forEach.call(document.querySelectorAll("#drawer .rrow"),function(b){b.onclick=function(){go(function(){showNode(rs[+b.dataset.i])})}})}
function openNode(n){stack=[];go(function(){showNode(n)})}
function showNode(n){
  if(n.people)return rootDrawer(n);
  if(n.role)return openDrawer(roleHtml(n.role));
  if(n.grp){var g=n.grp,r=roleFor(g.t),bs=groupBoss(g.t,n.org);
    openDrawer('<div class="fnlab">Посада</div><h2>'+esc(g.t)+'</h2><dl class="meta"><dt>Локація</dt><dd>'+esc(n.org.n)+'</dd>'+(bs?'<dt>Керівник</dt><dd>'+esc(bs)+'</dd>':'')+'</dl>'+'<h4>Хто на посаді · '+g.people.length+'</h4>'+g.people.map(personRow).join("")+(r?'<button class="btn" id="rb">Опис посади «'+esc(r.t)+'»</button>':''));
    if(r)$("#rb").onclick=function(){go(function(){openDrawer(roleHtml(r,true))})};return}
  if(n.org){var b=n.org;openDrawer('<div class="fnlab">'+(n.fr?'Франшиза':'Філія')+'</div><h2>'+esc(b.n)+'</h2>'+(b.note?'<div class="mission">'+esc(b.note)+'</div>':'')+'<h4>Команда · '+b.p.length+'</h4>'+b.p.map(personRow).join(""));return}
  if(n.k==="fn")return fnDrawer(n);
  if(n.info)return openDrawer('<div class="fnlab">Франшизи</div><h2>'+esc(n.t)+'</h2><div class="mission">'+esc(n.info)+'</div><h4>Клуби · '+n.ch.length+'</h4>'+n.ch.map(function(m,i){return'<button class="rrow" data-i="'+i+'"><b>'+esc(m.t)+'</b><span>'+esc(m.s)+'</span></button>'}).join("")),Array.prototype.forEach.call(document.querySelectorAll("#drawer .rrow"),function(b){b.onclick=function(){go(function(){showNode(n.ch[+b.dataset.i])})}});
  if(n.k==="hub")fly(n,true)}

render();
function isMob(){return innerWidth<=600}
function mobView(n,k){var r=vp.getBoundingClientRect();V.k=Math.max(MINK,k);V.x=r.width/2-(n.x+W/2)*V.k;V.y=90-n.y*V.k}
requestAnimationFrame(function(){fit();apply();if(isMob()){mobView(ostap,.7);apply()}});
(function(){var h=$(".hint");if(isMob())h.textContent="Щипок — масштаб, тягніть — рух. «+» розкриває блок, тап по блоку — інформація.";
  function gone(){h.classList.add("gone")}vp.addEventListener("pointerdown",gone,{once:true});setTimeout(gone,12000)})();
window.addEventListener("resize",function(){apply()});
</script>
